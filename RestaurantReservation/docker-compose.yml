services:
  postgres:
    image: postgres:16
    container_name: restaurant_reservations_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: restaurant_reservations
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - restaurant_reservations_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d restaurant_reservations"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  restaurant_reservations_data: